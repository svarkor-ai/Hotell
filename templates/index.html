<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea View Hotel — Boka rum med havsvy</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
  <h1>🌊 Sea View Hotel</h1>
  <p>Din semester börjar här — rum med havsutsikt direkt vid kusten</p>
</header>

<nav>
  <a data-page="rooms" href="#">Rum</a>
  <a data-page="bookings" href="#">Bokningar</a>
  <a data-page="calendar" href="#">Kalender</a>
</nav>

<main>
  <!-- Rooms Page -->
  <section id="page-rooms">
    <div class="card">
      <h2>Våra Rum</h2>
      <div class="filter-bar">
        <select id="filter-type">
          <option value="">Alla rumtyper</option>
          <option value="single">Enkel</option>
          <option value="double">Dubbel</option>
          <option value="four_person">Fyrasäng</option>
        </select>
        <button onclick="loadRooms()"> filtrera</button>
      </div>
      <div id="rooms-grid" class="room-grid"></div>
    </div>
  </section>

  <!-- Bookings Page -->
  <section id="page-bookings" class="hidden">
    <div class="card">
      <h2>Aktiva Bokningar</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Gäst</th>
              <th>Incheckning</th>
              <th>Utcheckning</th>
              <th>Pris</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="bookings-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Calendar Page -->
  <section id="page-calendar" class="hidden">
    <div class="card">
      <h2>Bokningskalender</h2>
      <div class="filter-bar">
        <select id="cal-month">
          <option value="1">Januari</option><option value="2">Februari</option>
          <option value="3">Mars</option><option value="4">April</option>
          <option value="5">Maj</option><option value="6">Juni</option>
          <option value="7">Juli</option><option value="8">Augusti</option>
          <option value="9">September</option><option value="10">Oktober</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
        <input type="number" id="cal-year" value="2026" min="2024" max="2030">
        <button onclick="loadMonthCalendar()">Visa kalender</button>
      </div>
      <div id="calendar-container" class="calendar-grid"></div>
    </div>
  </section>

  <!-- Booking Modal -->
  <div id="booking-modal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100">
    <div class="card" style="max-width:500px;width:90%;max-height:90vh;overflow-y:auto">
      <h2>Boka <span id="booking-room-label"></span></h2>
      <form id="booking-form" onsubmit="submitBooking(event)" data-room-id="">
        <div class="booking-form">
          <div class="form-group">
            <label>Namn *</label>
            <input name="guest_name" required>
          </div>
          <div class="form-group">
            <label>E-post *</label>
            <input name="guest_email" type="email" required>
          </div>
          <div class="form-group">
            <label>Telefon</label>
            <input name="guest_phone">
          </div>
          <div class="form-group">
            <label>Incheckning *</label>
            <input name="check_in" type="date" required>
          </div>
          <div class="form-group">
            <label>Utcheckning *</label>
            <input name="check_out" type="date" required>
          </div>
        </div>
        <div style="margin-top:1.25rem;display:flex;gap:0.75rem">
          <button type="submit" class="btn btn-primary">Bekräfta bokning</button>
          <button type="button" class="btn" onclick="closeBooking()" style="background:#e5e7eb">Avbryt</button>
        </div>
      </form>
    </div>
  </div>

  <div id="message-box"></div>
</main>

<footer>
  Sea View Hotel · Lokalt prototyp-projekt · 26 rum med havsvy
</footer>

<script src="/static/js/app.js"></script>
</body>
</html>
